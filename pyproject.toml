[project]
name = "agent-runtime-system"
version = "0.1.0"
description = "Task DAG based agent runtime skeleton."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "langgraph>=1.1,<2.0",
    "pydantic>=2.7,<3.0",
    "pymysql>=1.1,<2.0",
]

[project.optional-dependencies]
api = [
    "uvicorn>=0.30,<1.0",
]
test = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.3,<2.0",
]
dev = [
    "uvicorn>=0.30,<1.0",
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.3,<2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
asyncio_mode = "auto"
